name: Windows CI and preview release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Windows x64 checks
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run formatting, lint, tests, and release build
        shell: pwsh
        run: ./scripts/check-dev.ps1

  main-package:
    name: Package downloadable main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: VirtualDesktopRail-windows-x64-${{ github.sha }}
          # Keep the package folder inside the artifact ZIP, without nesting the local ZIP.
          path: |
            artifacts/
            !artifacts/*.zip
          if-no-files-found: error
          retention-days: 90

  draft-release:
    name: Package draft preview release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Validate tag against application version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Release tags must use vMAJOR.MINOR.PATCH; received '$tag'."
          }
          $tagVersion = $Matches[1]
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cargo metadata lookup failed.' }
          $app = $metadata.packages | Where-Object { $_.name -eq 'virtual-desktop-rail' } | Select-Object -First 1
          if (!$app) { throw 'Application package metadata was not found.' }
          if ($tagVersion -ne $app.version) {
              throw "Tag version $tagVersion does not match apps/rail Cargo version $($app.version)."
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ steps.version.outputs.version }}' -ReleaseTag '${{ github.ref_name }}'

      - name: Create draft prerelease with generated notes and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = $env:GITHUB_REF_NAME
          $package = Join-Path $env:GITHUB_WORKSPACE "artifacts/VirtualDesktopRail-$version-windows-x64"
          $archive = "$package.zip"
          $checksum = Join-Path $package 'SHA256.json'
          foreach ($path in @($archive, $checksum)) {
              if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Release asset is missing: $path" }
          }

          $generated = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$tag" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'GitHub release notes generation failed.' }
          $validationUrl = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/.devdocs/Status-and-Roadmap.md"
          $notes = @(
              '**Unsigned development preview.** This release is not broadly certified. Physical hardware, Explorer restart, and wider Windows compatibility validation remain open.'
              ''
              "See [implementation status and remaining validation]($validationUrl)."
              ''
              $generated.body
          ) -join [Environment]::NewLine
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release create $tag $archive $checksum --draft --prerelease --title $tag --notes-file $notesPath
